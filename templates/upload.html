<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>{{ title }}</title>
    <link rel="stylesheet" href="/static/app.css?v=12">
  </head>
  <body>
    <main class="shell">
      <header class="hero">
        <h1>{{ title }}</h1>
      </header>
      <section class="card">
        <form id="upload-form" data-auth-required="{{ auth_required }}" data-max-file-size="{{ max_file_size }}" data-mode="file">
          <div class="mode-toggle" role="tablist">
            <button type="button" class="mode-tab" data-mode-set="file" aria-selected="true">File</button>
            <button type="button" class="mode-tab" data-mode-set="text" aria-selected="false">Text</button>
          </div>
          <label class="drop" id="drop-zone">
            <input type="file" id="file" multiple>
            <span>Drag &amp; drop or click to choose a file</span>
          </label>
          <div class="text-row">
            <textarea id="text-input" rows="8" placeholder="Paste or type text to share"></textarea>
          </div>
          <div class="row">
            <label>
              Filename override
              <input type="text" id="filename" placeholder="Leave blank to keep original">
            </label>
            <label>
              Expiry
              <select id="expiry">
                {#- Rendered from the server's DEFAULT_EXPIRY/MIN_EXPIRY/MAX_EXPIRY -#}
                {% for choice in expiry_choices %}<option value="{{ choice.value }}">{{ choice.label }}</option>{% endfor %}
              </select>
            </label>
          </div>
          <div class="row token-row">
            <label>
              Upload token
              <input type="password" id="token" autocomplete="off" placeholder="Required on this server">
            </label>
          </div>
          <button type="submit">Upload</button>
        </form>
        <div id="result" class="result hidden" data-result></div>
      </section>
      <section class="notes">
        <div>
          <h2>CLI quickstart</h2>
          {#- site_url is the actual request origin, resolved server-side -#}
          <pre>curl{{ auth_snippet }} --upload-file ./hello.txt {{ site_url }}</pre>
        </div>
      </section>
    </main>
    <script src="/static/qr.js?v=1" defer></script>
    <script src="/static/app.js?v=14" defer></script>
  </body>
</html>
