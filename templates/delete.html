{% extends "base.html" %}

{% block content %}
      <section class="card">
        <div class="file-meta">
          <h2>{{ filename }}</h2>
          <p>{{ size }}</p>
          <p class="expiry">Deleting this file cannot be undone.</p>
        </div>
        <form method="post" action="/delete/{{ code }}">
          <input type="hidden" name="token" value="{{ token }}">
          <div class="result-actions">
            <button type="submit">Delete file</button>
            <a href="/{{ code }}">Cancel</a>
          </div>
        </form>
      </section>
{% endblock %}
