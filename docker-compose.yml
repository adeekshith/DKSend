# Production example. Start with:
#   docker compose up -d
services:
  dksend:
    image: ghcr.io/adeekshith/dksend:latest
    restart: unless-stopped
    ports:
      - "3000:3000"
    # The container runs as uid 1000. Pre-create the data dir so it is
    # writable: mkdir -p data && sudo chown -R 1000:1000 data
    volumes:
      - ./data:/data
    # Run as a different uid if your data dir is owned by another user:
    # user: "1000:1000"
    # Temporary escape hatch while migrating an old root-owned install:
    # user: "0:0"
    # All settings are optional; uncomment what you need.
    environment:
      DATA_DIR: /data
      # Public URL used in share links (set when behind a reverse proxy)
      # BASE_URL: https://files.example.com
      # Require a shared token for uploads (downloads stay public);
      # also enables the /admin page. Recommended on the open internet.
      # UPLOAD_TOKEN: change-me
      # Per-upload size limit and total storage cap, in bytes
      # MAX_FILE_SIZE: "209715200"      # 200 MB
      # MAX_TOTAL_STORAGE: "10737418240" # 10 GiB
      # Default and longest allowed lifetime (30m, 12h, 7d, ...)
      # DEFAULT_EXPIRY: 1d
      # MAX_EXPIRY: 7d
      # Per-IP rate limits per minute (0 disables)
      # RATE_LIMIT_UPLOADS_PER_MIN: "20"
      # RATE_LIMIT_LOOKUPS_PER_MIN: "60"
      # Per-request log lines on stderr (docker logs); 0 disables
      # ACCESS_LOG: "1"
      # Page heading and optional tagline
      # BRAND_TITLE: Send Files
      # BRAND_DESCRIPTION: Fast, friendly file drops.
    # Optional: liveness probe against the built-in /healthz endpoint.
    # Off by default — the periodic check keeps page-cache pages active,
    # which shows up as a few extra MB in docker stats.
    # healthcheck:
    #   test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/healthz"]
    #   interval: 60s
    #   timeout: 5s
    #   retries: 3
