[package]
name = "dksend"
version = "0.1.6"
edition = "2024"

[dependencies]
anyhow = "1"
axum = { version = "0.7", features = ["macros"] }
chrono = { version = "0.4", features = ["serde"] }
futures-util = "0.3"
http-body-util = "0.1"
rand = "0.10"
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
serde_json = "1"
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "sqlite", "macros", "migrate", "chrono"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "fs", "io-util", "signal", "sync", "time"] }
tokio-util = { version = "0.7", features = ["io"] }
tower-http = { version = "0.6", features = ["trace", "fs", "set-header"] }
urlencoding = "2"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
tempfile = "3"

# Smaller binary (= smaller resident page cache) at no runtime cost.
# opt-level stays at the default 3 and unwinding stays on so a panicking
# request can't take down the server.
[profile.release]
strip = true
lto = true
codegen-units = 1
