name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}

      - name: Rust tests
        run: cargo test

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: JS unit tests
        run: node --test tests/unit/app.test.mjs

      - name: Install Playwright
        working-directory: tests/e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Build server
        run: cargo build

      - name: Playwright e2e tests
        working-directory: tests/e2e
        run: npx playwright test
        env:
          DATA_DIR: /tmp/dksend-test-data
