<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>{{title}}</title>
    <link rel="stylesheet" href="/static/app.css?v=4">
  </head>
  <body>
    <main class="shell">
      <header class="hero">
        <h1>{{title}}</h1>
      </header>
      <section class="card">
        <form id="upload-form">
          <label class="drop" id="drop-zone">
            <input type="file" id="file">
            <span>Drag &amp; drop or click to choose a file</span>
          </label>
          <div class="row">
            <label>
              Filename override
              <input type="text" id="filename" placeholder="Leave blank to keep original">
            </label>
            <label>
              Expiry
              <select id="expiry">
                <!-- 1d is the default expiry; 24h is a duplicate and removed -->
                <option value="">1d (default)</option>
                <option value="30m">30m</option>
                <option value="1h">1h</option>
                <option value="7d">7d</option>
              </select>
            </label>
          </div>
          <button type="submit">Upload</button>
        </form>
        <div id="result" class="result hidden" data-result></div>
      </section>
      <section class="notes">
        <div>
          <h2>CLI quickstart</h2>
          <!-- {{site_url}} is replaced server-side with the actual request origin -->
          <pre>curl --upload-file ./hello.txt {{site_url}}</pre>
        </div>
      </section>
    </main>
    <script src="/static/app.js?v=4" defer></script>
  </body>
</html>
