<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>{{title}}</title>
    <link rel="stylesheet" href="/static/app.css?v=1">
  </head>
  <body>
    <main class="shell">
      <header class="hero">
        <h1>{{title}}</h1>
        <p>{{description}}</p>
      </header>
      <section class="card">
        <div class="file-meta">
          <h2>{{filename}}</h2>
          <p>{{size}} · uploaded {{created_at}}</p>
          <p class="expiry">Expires in {{expires_in}}</p>
        </div>
        <div class="actions">
          <a class="primary" href="{{download_url}}">Download</a>
        </div>
        <div class="link-list">
          <div class="link-row">
            <input type="text" readonly value="{{download_page_url}}">
            <button type="button" data-copy="{{download_page_url}}">Copy</button>
          </div>
          <div class="link-row">
            <input type="text" readonly value="{{download_url}}">
            <button type="button" data-copy="{{download_url}}">Copy</button>
          </div>
          {{sha256_block}}
        </div>
        <div class="code">
          <span>curl</span>
          <pre>curl -O '{{curl_url}}'</pre>
        </div>
      </section>
    </main>
    <script src="/static/app.js?v=1" defer></script>
  </body>
</html>
